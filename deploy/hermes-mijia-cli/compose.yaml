services:
  mijia-cli:
    build: .
    image: local/hermes-mijia-cli:5.0.0
    container_name: hermes-mijia-cli
    restart: unless-stopped
    ports:
      - "127.0.0.1:2223:2222"
    volumes:
      - ./home:/home/agent
      - ./authorized_keys:/etc/ssh/authorized_keys/agent:ro
      - ./hostkeys:/etc/ssh/hostkeys:ro
      - ./policy.json:/etc/mijia/house-policy.json:ro
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
      - /run:rw,nosuid,nodev,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - NET_RAW
    cpus: 1
    mem_limit: 512m
    pids_limit: 128
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"
